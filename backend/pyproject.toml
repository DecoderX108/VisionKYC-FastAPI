[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-kyc"
version = "1.0.0"
description = "Session-bound FastAPI / OpenCV KYC framework with explicit demo mode"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3", "pydantic-settings>=2.6,<3",
  "python-multipart>=0.0.20,<1", "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<5", "Pillow>=11,<13",
  "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
vision = ["torch>=2.6,<3", "mediapipe>=0.10.21,<0.11"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

