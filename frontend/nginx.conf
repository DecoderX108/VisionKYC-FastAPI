limit_req_zone $binary_remote_addr zone=kyc_frames:10m rate=15r/s;
limit_req_zone $binary_remote_addr zone=kyc_uploads:10m rate=6r/m;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;
    client_body_timeout 30s;
    limit_req_status 429;
    # Do not write request bodies, tokens, document IDs or client IPs to disk.
    access_log off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(self), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; media-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = /api/v1/kyc/verify-document {
        limit_req zone=kyc_uploads burst=3 nodelay;
        proxy_pass http://backend:8000;
        proxy_read_timeout 60s;
    }
    location /api/ {
        limit_req zone=kyc_frames burst=15 nodelay;
        proxy_pass http://backend:8000;
        proxy_read_timeout 60s;
    }
    location = /health {
        proxy_pass http://backend:8000;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}

